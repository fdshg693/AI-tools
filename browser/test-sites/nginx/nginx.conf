# tools/browser/test-sites/ 配下のテストサイトをまとめて 1 プロセス・1 ポート(8080)で配信する。
# 起動は `bash tools/browser/test-sites/serve.sh`（nginx -p test-sites/nginx で起動するため、
# 相対パスはすべて test-sites/nginx/ からの相対）。
daemon off;
worker_processes 1;
pid run/nginx.pid;
error_log run/error.log;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log run/access.log;
    client_body_temp_path run/client_body_temp;

    # 実験の再現性のためキャッシュを無効化する
    add_header Cache-Control "no-store";

    server {
        listen 8080;
        server_name localhost;

        # 既存シナリオ（workflow/playwright-app/scripts/stories/*.yaml）が
        # http://localhost:8080/<page>.html を直接指しているため、
        # custom_pages はルート直下のまま維持する。
        root ../custom_pages/pages;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # 追加サイト。ディレクトリ名 = URL プレフィックス。
        location /catalog/  { alias ../catalog/;  index index.html; }
        location /dynamic/  { alias ../dynamic/;  index index.html; }
        location /frames/   { alias ../frames/;   index index.html; }
        location /tables/   { alias ../tables/;   index index.html; }
        location /network/  { alias ../network/;  index index.html; }
        location /auth/     { alias ../auth/;     index index.html; }
        location /inputs/   { alias ../inputs/;   index index.html; }
        location /visual/   { alias ../visual/;   index index.html; }
        location /a11y/     { alias ../a11y/;     index index.html; }
        location /slow/     { alias ../slow/;     index index.html; }
    }
}
